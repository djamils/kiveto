###> symfony/mailer ###
  # Mailpit: catches every e-mail sent in dev (MAILER_DSN=smtp://mailer:1025 in
  # .env.dev); inbox at http://localhost:8025.
  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - kiveto-network
###< symfony/mailer ###
