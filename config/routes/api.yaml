api_clinic:
    resource: ../../src/Presentation/Clinic/Controller/Api/Clinic/
    type: attribute
    prefix: /api/clinic
    host: 'clinic.kiveto.local'

# The only API Platform import: the Portal API, on the portal host.
api_portal:
    resource: .
    type: api_platform
    prefix: /api/portal/v1
    host: 'portal.kiveto.local'

# The Portal routes that API Platform does not serve: file downloads and
# calendars (`__invoke` controllers), on the same prefix and host.
api_portal_controllers:
    resource: ../../src/Presentation/Api/Portal/Controller/
    type: attribute
    prefix: /api/portal/v1
    host: 'portal.kiveto.local'
