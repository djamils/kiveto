            $environment: '%kernel.environment%'

    App\System\Notification\Application\Port\EmailSenderInterface:
        class: App\System\Notification\Application\Port\EmailSenderInterface
        factory: ['@App\System\Notification\Infrastructure\Delivery\DeliverySelector', 'emailSender']

    App\System\Notification\Application\Port\SmsSenderInterface:
        class: App\System\Notification\Application\Port\SmsSenderInterface
        factory: ['@App\System\Notification\Infrastructure\Delivery\DeliverySelector', 'smsSender']

    App\System\Notification\Infrastructure\Delivery\Simulator\SimulatedDeliveryScheduler:
        arguments:
            $commandBus: '@messenger.bus.command'
            $delay: '%notification.simulator.delivery_delay%'

    # Retry policy of async_external_notification (Retry-After honoured, bounded).
    App\System\Notification\Infrastructure\Messaging\DispatchRetryStrategy:
        arguments:
            $maxRetries: 5
            $delayMilliseconds: 30000
            $multiplier: 3

