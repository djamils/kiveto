# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.default_locale: 'en-GB'
    app.backoffice_locale: 'fr-FR'
    app.short_locale_map:
        fr: 'fr-FR'
        en: 'en-GB'

    vetsaas.search.bucket_order:
        - 'animal'
        - 'client'
    vetsaas.search.bucket_icons:
        animal: 'paw-print'
        client: 'user'
    vetsaas.search.route_map:
        animal: 'clinic_animals_view'
        client: 'clinic_clients_view'

    # Procurement BC parameters
    procurement.simulation.profile: 'DEMO_FAST'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $apiClinicIpLimiter: '@limiter.api_clinic_ip'
            $apiClinicSearchLimiter: '@limiter.api_clinic_search'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Presentation\Clinic\Controller\:
        resource: '../src/Presentation/Clinic/Controller/'
        tags: ['controller.service_arguments']

    App\Presentation\Portal\Controller\:
        resource: '../src/Presentation/Portal/Controller/'
        tags: ['controller.service_arguments']

    App\Presentation\Backoffice\Controller\:
        resource: '../src/Presentation/Backoffice/Controller/'
        tags: ['controller.service_arguments']

    App\System\IdentityAccess\Infrastructure\Security\Symfony\ContextUserProvider.clinic:
        class: App\System\IdentityAccess\Infrastructure\Security\Symfony\ContextUserProvider
        arguments:
            $users: '@App\System\IdentityAccess\Domain\Repository\UserRepositoryInterface'
            $type: !php/const App\System\IdentityAccess\Domain\ValueObject\UserType::CLINIC

    App\System\IdentityAccess\Infrastructure\Security\Symfony\ContextUserProvider.portal:
        class: App\System\IdentityAccess\Infrastructure\Security\Symfony\ContextUserProvider
        arguments:
            $users: '@App\System\IdentityAccess\Domain\Repository\UserRepositoryInterface'
            $type: !php/const App\System\IdentityAccess\Domain\ValueObject\UserType::PORTAL

    App\System\IdentityAccess\Infrastructure\Security\Symfony\ContextUserProvider.backoffice:
        class: App\System\IdentityAccess\Infrastructure\Security\Symfony\ContextUserProvider
        arguments:
            $users: '@App\System\IdentityAccess\Domain\Repository\UserRepositoryInterface'
            $type: !php/const App\System\IdentityAccess\Domain\ValueObject\UserType::BACKOFFICE

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # ============================================================================
    # BOUNDED CONTEXT: SHARED
    # ============================================================================

    # Clock - System Clock by default
    App\Shared\Domain\Time\ClockInterface:
        class: App\Shared\Infrastructure\Time\SystemClock

    # UUID Generator - Symfony UUIDv7 by default
    App\Shared\Domain\Identifier\UuidGeneratorInterface:
        class: App\Shared\Infrastructure\Identifier\SymfonyUuidV7Generator

    # Message Context and Actor Context (singletons)
    App\Shared\Application\Messaging\MessageContext: ~
    App\Shared\Application\Security\ActorContext: ~

    # Messenger Middlewares
    App\Shared\Infrastructure\Bus\Messenger\Middleware\MessageMetadataMiddleware: ~
    App\Shared\Infrastructure\Bus\Messenger\Middleware\MessageContextMiddleware: ~
    App\Shared\Infrastructure\Bus\Messenger\Middleware\MessageLoggingMiddleware:
        arguments:
            $logger: '@monolog.logger.messenger'

    # Bus Interfaces
    App\Shared\Application\Bus\CommandBusInterface:
        class: App\Shared\Infrastructure\Bus\Messenger\CommandBus
        arguments:
            $messageBus: '@messenger.bus.command'

    App\Shared\Application\Bus\QueryBusInterface:
        class: App\Shared\Infrastructure\Bus\Messenger\QueryBus
        arguments:
            $messageBus: '@messenger.bus.query'

    App\Shared\Application\Bus\EventBusInterface:
        class: App\Shared\Infrastructure\Bus\Messenger\EventBus
        arguments:
            $messageBus: '@messenger.bus.event'

    App\Shared\Application\Bus\IntegrationEventBusInterface:
        class: App\Shared\Infrastructure\Bus\Messenger\IntegrationEventBus
        arguments:
            $messageBus: '@messenger.bus.integration_event'

    # Domain Event Publisher
    App\Shared\Application\Event\DomainEventPublisher: ~

    # Integration Event Publisher
    App\Shared\Application\Event\IntegrationEventPublisher: ~

    # Doctrine naming strategy with BC prefix
    app.orm.naming_strategy.bounded_context_prefix:
        class: App\Shared\Infrastructure\Persistence\Doctrine\Mapping\BoundedContextPrefixNamingStrategy
        arguments:
            - '@doctrine.orm.naming_strategy.underscore_number_aware'

    # Shared / Money — static ISO 4217 currency catalogue
    App\Shared\Money\Domain\Service\CurrencyRegistry:
        class: App\Shared\Money\Infrastructure\Registry\YamlCurrencyRegistry
        arguments:
            $catalogPath: '%kernel.project_dir%/src/Shared/Money/Infrastructure/Resources/currencies.yaml'
        public: true

    # Shared / UnitOfMeasure — static unit catalogue loaded from YAML
    App\Shared\Domain\UnitOfMeasure\Service\UnitOfMeasureRegistry:
        class: App\Shared\Infrastructure\UnitOfMeasure\Registry\YamlUnitOfMeasureRegistry
        arguments:
            $catalogPath: '%kernel.project_dir%/src/Shared/Infrastructure/UnitOfMeasure/Resources/units.yaml'

    # ============================================================================
    # BOUNDED CONTEXT: IDENTITY ACCESS
    # ============================================================================

    App\System\IdentityAccess\Domain\Repository\UserRepositoryInterface:
        class: App\System\IdentityAccess\Infrastructure\Persistence\Doctrine\Repository\DoctrineUserRepository

    App\System\IdentityAccess\Infrastructure\Persistence\Doctrine\Mapper\UserMapper: ~

    # ============================================================================
    # BOUNDED CONTEXT: TRANSLATION
