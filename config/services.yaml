# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $apiClinicIpLimiter: '@limiter.api_clinic_ip'
            $apiClinicSearchLimiter: '@limiter.api_clinic_search'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Presentation\Clinic\Controller\:
        resource: '../src/Presentation/Clinic/Controller/'
        tags: ['controller.service_arguments']

    App\Presentation\Portal\Controller\:
        resource: '../src/Presentation/Portal/Controller/'
        tags: ['controller.service_arguments']

    App\Presentation\Backoffice\Controller\:
        resource: '../src/Presentation/Backoffice/Controller/'
        tags: ['controller.service_arguments']

    App\System\IdentityAccess\Infrastructure\Security\Symfony\ContextUserProvider.clinic:
        class: App\System\IdentityAccess\Infrastructure\Security\Symfony\ContextUserProvider
        arguments:
            $users: '@App\System\IdentityAccess\Domain\Repository\UserRepositoryInterface'
            $type: !php/const App\System\IdentityAccess\Domain\ValueObject\UserType::CLINIC

    App\System\IdentityAccess\Infrastructure\Security\Symfony\ContextUserProvider.portal:
        class: App\System\IdentityAccess\Infrastructure\Security\Symfony\ContextUserProvider
        arguments:
            $users: '@App\System\IdentityAccess\Domain\Repository\UserRepositoryInterface'
            $type: !php/const App\System\IdentityAccess\Domain\ValueObject\UserType::PORTAL

    App\System\IdentityAccess\Infrastructure\Security\Symfony\ContextUserProvider.backoffice:
        class: App\System\IdentityAccess\Infrastructure\Security\Symfony\ContextUserProvider
        arguments:
            $users: '@App\System\IdentityAccess\Domain\Repository\UserRepositoryInterface'
            $type: !php/const App\System\IdentityAccess\Domain\ValueObject\UserType::BACKOFFICE

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # ============================================================================
    # BOUNDED CONTEXT: SHARED
    # ============================================================================

    # Clock - System Clock by default
    App\Shared\Domain\Time\ClockInterface:
        class: App\Shared\Infrastructure\Time\SystemClock

    # UUID Generator - Symfony UUIDv7 by default
    App\Shared\Domain\Identifier\UuidGeneratorInterface:
        class: App\Shared\Infrastructure\Identifier\SymfonyUuidV7Generator

    # Message Context and Actor Context (singletons)
    App\Shared\Application\Messaging\MessageContext: ~
    App\Shared\Application\Security\ActorContext: ~

    # Messenger Middlewares
    App\Shared\Infrastructure\Bus\Messenger\Middleware\MessageMetadataMiddleware: ~
    App\Shared\Infrastructure\Bus\Messenger\Middleware\MessageContextMiddleware: ~
    App\Shared\Infrastructure\Bus\Messenger\Middleware\MessageLoggingMiddleware:
        arguments:
            $logger: '@monolog.logger.messenger'

    # Bus Interfaces
    App\Shared\Application\Bus\CommandBusInterface:
        class: App\Shared\Infrastructure\Bus\Messenger\CommandBus
        arguments:
            $messageBus: '@messenger.bus.command'

    App\Shared\Application\Bus\QueryBusInterface:
        class: App\Shared\Infrastructure\Bus\Messenger\QueryBus
        arguments:
            $messageBus: '@messenger.bus.query'

    App\Shared\Application\Bus\EventBusInterface:
        class: App\Shared\Infrastructure\Bus\Messenger\EventBus
        arguments:
            $messageBus: '@messenger.bus.event'

    App\Shared\Application\Bus\IntegrationEventBusInterface:
        class: App\Shared\Infrastructure\Bus\Messenger\IntegrationEventBus
        arguments:
            $messageBus: '@messenger.bus.integration_event'

    # Domain Event Publisher
    App\Shared\Application\Event\DomainEventPublisher: ~

    # Integration Event Publisher
    App\Shared\Application\Event\IntegrationEventPublisher: ~

    # Doctrine naming strategy with BC prefix
    app.orm.naming_strategy.bounded_context_prefix:
        class: App\Shared\Infrastructure\Persistence\Doctrine\Mapping\BoundedContextPrefixNamingStrategy
        arguments:
            - '@doctrine.orm.naming_strategy.underscore_number_aware'

    # ============================================================================
    # BOUNDED CONTEXT: IDENTITY ACCESS
    # ============================================================================

    App\System\IdentityAccess\Domain\Repository\UserRepositoryInterface:
        class: App\System\IdentityAccess\Infrastructure\Persistence\Doctrine\Repository\DoctrineUserRepository

    App\System\IdentityAccess\Infrastructure\Persistence\Doctrine\Mapper\UserMapper: ~

    # ============================================================================
    # BOUNDED CONTEXT: TRANSLATION
    # ============================================================================

    App\System\Translation\Domain\Repository\TranslationCatalogRepository:
        class: App\System\Translation\Infrastructure\Persistence\Doctrine\Repository\DoctrineTranslationCatalogRepository

    App\System\Translation\Domain\Repository\TranslationSearchRepository:
        class: App\System\Translation\Infrastructure\Persistence\Doctrine\Repository\DoctrineTranslationSearchRepository

    App\System\Translation\Application\Port\CatalogCacheInterface:
        class: App\System\Translation\Infrastructure\Cache\SymfonyCatalogCache
        arguments:
            $cachePool: '@cache.translation_catalog'

    App\System\Translation\Application\Port\AppScopeResolverInterface:
        class: App\System\Translation\Infrastructure\Resolver\HostnameAppScopeResolver

    App\System\Translation\Application\Port\LocaleResolverInterface:
        class: App\System\Translation\Infrastructure\Resolver\DefaultLocaleResolver

    App\System\Translation\Infrastructure\Provider\TranslationCatalogProvider:
        arguments:
            $repository: '@App\System\Translation\Domain\Repository\TranslationSearchRepository'
            $cache: '@App\System\Translation\Application\Port\CatalogCacheInterface'
            $ttl: 3600
        tags:
            - { name: kernel.reset, method: reset }

    App\System\Translation\Infrastructure\Symfony\Translator\CatalogTranslator:
        decorates: translator
        arguments:
            $fallbackTranslator: '@App\System\Translation\Infrastructure\Symfony\Translator\CatalogTranslator.inner'
            $catalogProvider: '@App\System\Translation\Infrastructure\Provider\TranslationCatalogProvider'
            $scopeResolver: '@App\System\Translation\Application\Port\AppScopeResolverInterface'
            $localeResolver: '@App\System\Translation\Application\Port\LocaleResolverInterface'
            $formatter: '@translator.formatter'
        tags:
            - { name: kernel.reset, method: reset }

    # ============================================================================
    # BOUNDED CONTEXT: CLINIC
    # ============================================================================

    App\Context\Clinic\Domain\Repository\ClinicRepositoryInterface:
        class: App\Context\Clinic\Infrastructure\Persistence\Doctrine\Repository\DoctrineClinicRepository

    App\Context\Clinic\Domain\Repository\ClinicGroupRepositoryInterface:
        class: App\Context\Clinic\Infrastructure\Persistence\Doctrine\Repository\DoctrineClinicGroupRepository

    App\Context\Clinic\Application\Port\ClinicReadRepositoryInterface:
        class: App\Context\Clinic\Infrastructure\Persistence\Doctrine\Repository\DoctrineClinicReadRepository

    App\Context\Clinic\Application\Port\ClinicGroupReadRepositoryInterface:
        class: App\Context\Clinic\Infrastructure\Persistence\Doctrine\Repository\DoctrineClinicGroupReadRepository

    App\Context\Clinic\Infrastructure\Persistence\Doctrine\Mapper\ClinicMapper: ~
    App\Context\Clinic\Infrastructure\Persistence\Doctrine\Mapper\ClinicGroupMapper: ~

    # ============================================================================
    # BOUNDED CONTEXT: CLINIC — STAFF
    # ============================================================================

    App\Context\Clinic\Domain\Staff\Repository\ClinicMembershipRepositoryInterface:
        class: App\Context\Clinic\Infrastructure\Persistence\Doctrine\Repository\DoctrineClinicMembershipRepository

    App\Context\Clinic\Application\Port\ClinicMembershipReadRepositoryInterface:
        class: App\Context\Clinic\Infrastructure\Persistence\Doctrine\Repository\DoctrineClinicMembershipReadRepository

    App\Context\Clinic\Application\Port\MembershipAdminRepositoryInterface:
        class: App\Context\Clinic\Infrastructure\Persistence\Doctrine\Repository\DoctrineMembershipAdminRepository

    App\Context\Clinic\Application\Port\UserExistenceCheckerInterface:
        class: App\Context\Clinic\Infrastructure\Adapter\IdentityAccess\DbalUserExistenceChecker

    App\Context\Clinic\Infrastructure\Persistence\Doctrine\Mapper\ClinicMembershipMapper: ~

    # ============================================================================
    # BOUNDED CONTEXT: ACCESS CONTROL (RBAC)
    # ============================================================================

    App\System\AccessControl\Domain\Repository\RoleAssignmentRepositoryInterface:
        class: App\System\AccessControl\Infrastructure\Persistence\Doctrine\Repository\DoctrineRoleAssignmentRepository

    App\System\AccessControl\Domain\Repository\RolePermissionRepositoryInterface:
        class: App\System\AccessControl\Infrastructure\Persistence\Doctrine\Repository\DoctrineRolePermissionRepository

    App\System\AccessControl\Application\Port\AccessControlServiceInterface:
        class: App\System\AccessControl\Infrastructure\Persistence\Doctrine\DbalAccessControlService

    App\System\AccessControl\Infrastructure\Persistence\Doctrine\Mapper\RoleAssignmentMapper: ~
    App\System\AccessControl\Infrastructure\Persistence\Doctrine\Mapper\RolePermissionMapper: ~

    # Context
    App\Shared\Application\Context\CurrentClinicContextInterface:
        class: App\Shared\Application\Context\CurrentClinicContext

    # ============================================================================
    # BOUNDED CONTEXT: CLIENT
    # ============================================================================

    App\Context\Client\Domain\Repository\ClientRepositoryInterface:
        class: App\Context\Client\Infrastructure\Persistence\Doctrine\Repository\DoctrineClientRepository

    App\Context\Client\Application\Port\ClientReadRepositoryInterface:
        class: App\Context\Client\Infrastructure\Persistence\Doctrine\Repository\DoctrineClientReadRepository

    App\Context\Client\Infrastructure\Persistence\Doctrine\Mapper\ClientMapper: ~

    # ============================================================================
    # BOUNDED CONTEXT: ANIMAL
    # ============================================================================

    App\Context\Animal\Domain\Port\AnimalRepositoryInterface:
        class: App\Context\Animal\Infrastructure\Persistence\Doctrine\DoctrineAnimalRepository

    App\Context\Animal\Domain\Port\AnimalReadRepositoryInterface:
        class: App\Context\Animal\Infrastructure\Persistence\Doctrine\DoctrineAnimalReadRepository

    App\Context\Animal\Infrastructure\Persistence\Doctrine\AnimalMapper: ~

    # ============================================================================
    # BOUNDED CONTEXT: SCHEDULING
    # ============================================================================

    App\Context\Scheduling\Domain\Repository\AppointmentRepositoryInterface:
        class: App\Context\Scheduling\Infrastructure\Persistence\Doctrine\Repository\DoctrineAppointmentRepository

    App\Context\Scheduling\Domain\Repository\WaitingRoomEntryRepositoryInterface:
        class: App\Context\Scheduling\Infrastructure\Persistence\Doctrine\Repository\DoctrineWaitingRoomEntryRepository

    App\Context\Scheduling\Application\Port\WaitingRoomReadRepositoryInterface:
        class: App\Context\Scheduling\Infrastructure\Persistence\Doctrine\Repository\DoctrineWaitingRoomReadRepository

    App\Context\Scheduling\Application\Port\MembershipEligibilityCheckerInterface:
        class: App\Context\Scheduling\Infrastructure\Adapter\Clinic\DbalMembershipEligibilityChecker

    App\Context\Scheduling\Application\Port\AppointmentConflictCheckerInterface:
        class: App\Context\Scheduling\Infrastructure\Adapter\DbalAppointmentConflictChecker

    App\Context\Scheduling\Application\Port\OwnerExistenceCheckerInterface:
        class: App\Context\Scheduling\Infrastructure\Adapter\Client\DbalOwnerExistenceChecker

    App\Context\Scheduling\Application\Port\AnimalExistenceCheckerInterface:
        class: App\Context\Scheduling\Infrastructure\Adapter\Animal\DbalAnimalExistenceChecker

    App\Context\Scheduling\Infrastructure\Persistence\Doctrine\Mapper\AppointmentMapper: ~
    App\Context\Scheduling\Infrastructure\Persistence\Doctrine\Mapper\WaitingRoomEntryMapper: ~

    # ============================================================================
    # BOUNDED CONTEXT: CONSULTATION
    # ============================================================================

    App\Context\Consultation\Domain\Repository\ConsultationRepositoryInterface:
        class: App\Context\Consultation\Infrastructure\Persistence\Doctrine\Repository\DoctrineConsultationRepository

    App\Context\Consultation\Application\Port\ConsultationReadRepositoryInterface:
        class: App\Context\Consultation\Infrastructure\Persistence\Doctrine\Repository\DoctrineConsultationReadRepository

    App\Context\Consultation\Application\Port\PractitionerEligibilityCheckerInterface:
        class: App\Context\Consultation\Infrastructure\Adapter\Clinic\DbalPractitionerEligibilityChecker

    App\Context\Consultation\Application\Port\SchedulingAppointmentContextProviderInterface:
        class: App\Context\Consultation\Infrastructure\Adapter\Scheduling\DbalSchedulingAppointmentContextProvider

    App\Context\Consultation\Application\Port\SchedulingServiceCoordinatorInterface:
        class: App\Context\Consultation\Infrastructure\Adapter\Scheduling\MessengerSchedulingServiceCoordinator

    App\Context\Consultation\Application\Port\OwnerExistenceCheckerInterface:
        class: App\Context\Consultation\Infrastructure\Adapter\Client\DbalOwnerExistenceChecker

    App\Context\Consultation\Application\Port\AnimalExistenceCheckerInterface:
        class: App\Context\Consultation\Infrastructure\Adapter\Animal\DbalAnimalExistenceChecker

    App\Context\Consultation\Infrastructure\Persistence\Doctrine\Mapper\ConsultationMapper: ~
    App\Context\Consultation\Infrastructure\Persistence\Doctrine\Mapper\ClinicalNoteMapper: ~
    App\Context\Consultation\Infrastructure\Persistence\Doctrine\Mapper\PerformedActMapper: ~

when@dev: &services_dev
    services:
        App\Fixtures\:
            resource: '../fixtures/'
            autowire: true
            autoconfigure: true

when@test:
    services:
        App\Fixtures\:
            resource: '../fixtures/'
            autowire: true
            autoconfigure: true

        # Deterministic rate limiter stubs (programmable, zero wall-clock dependency)
        App\Tests\Fixtures\RateLimit\StubRateLimiterFactory.search:
            class: App\Tests\Fixtures\RateLimit\StubRateLimiterFactory
            public: true

        App\Tests\Fixtures\RateLimit\StubRateLimiterFactory.ip:
            class: App\Tests\Fixtures\RateLimit\StubRateLimiterFactory
            public: true

        limiter.api_clinic_search:
            alias: 'App\Tests\Fixtures\RateLimit\StubRateLimiterFactory.search'
            public: true

        limiter.api_clinic_ip:
            alias: 'App\Tests\Fixtures\RateLimit\StubRateLimiterFactory.ip'
            public: true
