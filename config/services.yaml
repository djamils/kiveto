    App\Context\Scheduling\Infrastructure\Persistence\Doctrine\Mapper\AppointmentMapper: ~
    App\Context\Scheduling\Infrastructure\Persistence\Doctrine\Mapper\PlanningBlockMapper: ~

    App\Context\Scheduling\Domain\Repository\PlanningBlockRepositoryInterface:
        class: App\Context\Scheduling\Infrastructure\Persistence\Doctrine\Repository\DoctrinePlanningBlockRepository

    App\Context\Scheduling\Application\Port\PlanningBlockOverlapCheckerInterface:
