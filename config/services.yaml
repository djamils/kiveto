    App\System\Translation\Application\Port\CatalogCacheInterface:
        class: App\System\Translation\Infrastructure\Cache\SymfonyCatalogCache
        arguments:
            $cachePool: '@cache.translation_catalog'

    App\System\Translation\Application\Port\AppScopeResolverInterface:
        class: App\System\Translation\Infrastructure\Resolver\HostnameAppScopeResolver

    App\System\Translation\Infrastructure\Resolver\DefaultLocaleResolver:
        arguments:
            $defaultLocale: '%app.default_locale%'
            $backofficeLocale: '%app.backoffice_locale%'
            $shortLocaleMap: '%app.short_locale_map%'

    App\System\Translation\Application\Port\LocaleResolverInterface: '@App\System\Translation\Infrastructure\Resolver\DefaultLocaleResolver'

    App\System\Translation\Infrastructure\Provider\TranslationCatalogProvider:
        arguments:
            $repository: '@App\System\Translation\Domain\Repository\TranslationSearchRepository'
            $cache: '@App\System\Translation\Application\Port\CatalogCacheInterface'
            $ttl: 3600
        tags:
            - { name: kernel.reset, method: reset }

    App\System\Translation\Infrastructure\Symfony\Translator\CatalogTranslator:
        decorates: translator
        arguments:
            $fallbackTranslator: '@App\System\Translation\Infrastructure\Symfony\Translator\CatalogTranslator.inner'
            $catalogProvider: '@App\System\Translation\Infrastructure\Provider\TranslationCatalogProvider'
            $scopeResolver: '@App\System\Translation\Application\Port\AppScopeResolverInterface'
            $localeResolver: '@App\System\Translation\Application\Port\LocaleResolverInterface'
            $formatter: '@translator.formatter'
        tags:
            - { name: kernel.reset, method: reset }

