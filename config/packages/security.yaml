security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        clinic_user_provider:
            id: App\System\IdentityAccess\Infrastructure\Security\Symfony\ContextUserProvider.clinic

        portal_user_provider:
            id: App\System\IdentityAccess\Infrastructure\Security\Symfony\ContextUserProvider.portal

        backoffice_user_provider:
            id: App\System\IdentityAccess\Infrastructure\Security\Symfony\ContextUserProvider.backoffice

        # Owners of the Portal API, loaded by the `sub` of their access token.
        portal_api_user_provider:
            id: App\Presentation\Api\Portal\Security\PortalApiUserProvider

    firewalls:
        # Brevo delivery webhooks (any host): no session, no user; the request
        # parsers authenticate Brevo (IP ranges + shared secret).
        webhook:
            pattern: ^/webhook/
            security: false

        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        clinic:
            lazy: true
            pattern: ^/
            host: '^clinic\.kiveto\.local$'
            provider: clinic_user_provider
            custom_authenticators:
                - App\System\IdentityAccess\Infrastructure\Security\Symfony\ContextAuthenticator
            logout:
                path: /logout
                # The sign-in page greets the member with « Vous êtes déconnecté ».
                target: /login?deco=1
                invalidate_session: true

        # Portal API: stateless, Bearer access tokens (lexik). Symfony ignores
        # `lazy` on stateless firewalls: the authenticator itself skips the
        # routes access_control declares public, so that a stale token sent to
        # refresh, codes or invitations is ignored instead of answering 401.
        portal_api:
            stateless: true
            pattern: ^/api/portal/v1
            host: '^portal\.kiveto\.local$'
            provider: portal_api_user_provider
            jwt:
                authenticator: app.portal_api.jwt_authenticator

        portal:
            lazy: true
            pattern: ^/
            host: '^portal\.kiveto\.local$'
            provider: portal_user_provider
            custom_authenticators:
                - App\System\IdentityAccess\Infrastructure\Security\Symfony\ContextAuthenticator
            logout:
                path: /logout
                invalidate_session: true

        backoffice:
            lazy: true
            pattern: ^/
            host: '^backoffice\.kiveto\.local$'
            provider: backoffice_user_provider
            custom_authenticators:
                - App\System\IdentityAccess\Infrastructure\Security\Symfony\ContextAuthenticator
            logout:
                path: /logout
                invalidate_session: true

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        # Allow unauthenticated access to the login endpoint to avoid redirect loops
        - { host: '^clinic\.kiveto\.local$', path: '^/login', roles: PUBLIC_ACCESS }
        # Forgot password, reset link and invitation link (the token-less
        # addresses are where the links redirect once the secret is in the session)
        - { host: '^clinic\.kiveto\.local$', path: '^/(mot-de-passe-oublie|reinitialiser(/[^/]+)?|invitation(/[^/]+)?)$', roles: PUBLIC_ACCESS }
        - { host: '^portal\.kiveto\.local$', path: '^/login', roles: PUBLIC_ACCESS }
        # Portal API: sign-in, refresh, invitations, terms and docs are public;
        # `_test/` routes only exist in the test env.
        - { host: '^portal\.kiveto\.local$', path: '^/api/portal/v1/(auth/otp|auth/refresh|invitations|legal|docs|_test/)', roles: PUBLIC_ACCESS }
        - { host: '^portal\.kiveto\.local$', path: '^/api/portal/v1', roles: IS_AUTHENTICATED_FULLY }
        - { host: '^backoffice\.kiveto\.local$', path: '^/login', roles: PUBLIC_ACCESS }

        # Protect everything else
        - { host: '^clinic\.kiveto\.local$', path: '^/', roles: IS_AUTHENTICATED_FULLY }
        - { host: '^portal\.kiveto\.local$', path: '^/', roles: IS_AUTHENTICATED_FULLY }
        - { host: '^backoffice\.kiveto\.local$', path: '^/', roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
