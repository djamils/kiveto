# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    # Reverse proxies whose X-Forwarded-* headers are believed (client IP of the
    # Brevo webhooks); none by default.
    trusted_proxies: '%env(SYMFONY_TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port']

    trusted_hosts:
        - '^localhost(:\d+)?$'
        - '^clinic\.kiveto\.local(:\d+)?$'
        - '^portal\.kiveto\.local(:\d+)?$'
        - '^backoffice\.kiveto\.local(:\d+)?$'
        # Host on which Brevo calls the webhooks (hooks.kiveto.fr, dev tunnel).
        - '%env(NOTIFICATION_WEBHOOK_HOST)%'

    # One scoped client per external service (see src/Shared/README.md, External APIs):
    # idle timeout 2 s (also bounds a stalled connect), 5 s in total, no retry.
    http_client:
        scoped_clients:
            registry.client:
                base_uri: 'https://recherche-entreprises.api.gouv.fr'
                headers:
                    User-Agent: '%env(EXTERNAL_API_USER_AGENT)%'
                    Accept: 'application/json'
                timeout: 2
                max_duration: 5
            vies.client:
                base_uri: 'https://ec.europa.eu/taxation_customs/vies/rest-api/'
                headers:
                    User-Agent: '%env(EXTERNAL_API_USER_AGENT)%'
                    Accept: 'application/json'
                timeout: 2
                max_duration: 5

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

        # No test reaches the network: the transport of every HTTP client (the
        # default one and the scoped ones) fails on any call its test did not mock.
        http_client:
            mock_response_factory: App\Tests\Support\UnmockedHttpCallGuard

        # Unit tests: allow "fake" hosts used by Request::getHost()
        trusted_hosts:
            - '^(.+\.)?example(:\d+)?$'
            - '^(.+\.)?kiveto\.test(:\d+)?$'
            - '^(.+\.)?kiveto\.local(:\d+)?$'
