# Access tokens of the Portal API (15 min). Refresh tokens are not handled by
# lexik: they are opaque, hashed and rotated by IdentityAccess.
lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: 900
    user_id_claim: sub
