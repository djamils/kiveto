framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    table_name: 'shared__messenger_messages'
                    auto_setup: false
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            # Same table as `async`; rows are told apart by the `queue_name` column.
            failed:
                dsn: 'doctrine://default?queue_name=failed'
                options:
                    table_name: 'shared__messenger_messages'
                    auto_setup: false
            # Commands that call external services (ExternalApiCommandInterface), consumed
            # by the external worker only. Same table and connection as `async`: a send
            # inside a business transaction is part of it (implicit outbox).
            async_external:
                dsn: 'doctrine://default?queue_name=external'
                options:
                    table_name: 'shared__messenger_messages'
                    auto_setup: false
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            # Batch sends (nightly runs), drained after `async_external` by the same worker.
            async_external_batch:
                dsn: 'doctrine://default?queue_name=external_batch'
                options:
                    table_name: 'shared__messenger_messages'
                    auto_setup: false
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            # Outbound notifications handed to Brevo (e-mail, SMS), consumed by the
            # external worker after `async_external`. Own queue and retry policy so
            # that ElectronicInvoicing's `async_external` strategy stays unchanged.
            # DispatchRetryStrategy: 5 retries, 30 s × 3, never shorter than the
            # provider's Retry-After (429); exhausted → DispatchFailureListener.
            async_external_notification:
                dsn: 'doctrine://default?queue_name=external_notification'
                options:
                    table_name: 'shared__messenger_messages'
                    auto_setup: false
                retry_strategy:
                    service: App\System\Notification\Infrastructure\Messaging\DispatchRetryStrategy
            sync: 'sync://'

        # Separate bus definitions for CQRS
        default_bus: messenger.bus.command

        buses:
            # Bus for commands (write operations)
            messenger.bus.command:
                middleware:
                    # First: the request's query answers are neither served nor
                    # kept while the command runs, and are forgotten once it ran.
                    - App\Shared\Infrastructure\Bus\Messenger\Middleware\ForgetQueryAnswersMiddleware
                    - App\Shared\Infrastructure\Bus\Messenger\Middleware\MessageMetadataMiddleware
                    - App\Shared\Infrastructure\Bus\Messenger\Middleware\MessageContextMiddleware
                    - App\Shared\Infrastructure\Bus\Messenger\Middleware\MessageLoggingMiddleware
                    - validation
                    - doctrine_transaction

            # Bus for queries (read operations). No `validation`: queries carry no
            # constraint (the code builds them, not a form), and validating each of
            # the hundreds a page asks cost more than handling some of them.
            messenger.bus.query:
                middleware:
                    - App\Shared\Infrastructure\Bus\Messenger\Middleware\MessageMetadataMiddleware
                    - App\Shared\Infrastructure\Bus\Messenger\Middleware\MessageContextMiddleware
                    - App\Shared\Infrastructure\Bus\Messenger\Middleware\MessageLoggingMiddleware

            # Bus for commands that call external services: no transaction, so that no
            # network call ever runs inside one (the handler records its outcome
            # through a short transactional command on the command bus).
            messenger.bus.external_api:
                middleware:
                    - App\Shared\Infrastructure\Bus\Messenger\Middleware\ForgetQueryAnswersMiddleware
                    - App\Shared\Infrastructure\Bus\Messenger\Middleware\MessageMetadataMiddleware
                    - App\Shared\Infrastructure\Bus\Messenger\Middleware\MessageContextMiddleware
                    - App\Shared\Infrastructure\Bus\Messenger\Middleware\MessageLoggingMiddleware
                    - validation

            # Bus for domain events
            messenger.bus.event:
                default_middleware:
                    enabled: true
                    allow_no_handlers: true
                    allow_no_senders: true
                middleware:
                    - App\Shared\Infrastructure\Bus\Messenger\Middleware\MessageMetadataMiddleware
                    - App\Shared\Infrastructure\Bus\Messenger\Middleware\MessageContextMiddleware
                    - App\Shared\Infrastructure\Bus\Messenger\Middleware\MessageLoggingMiddleware

            # Bus for integration events (cross-bounded contexts)
            messenger.bus.integration_event:
                default_middleware:
                    enabled: true
                    allow_no_handlers: true
                    allow_no_senders: true
                middleware:
                    - App\Shared\Infrastructure\Bus\Messenger\Middleware\MessageMetadataMiddleware
                    - App\Shared\Infrastructure\Bus\Messenger\Middleware\MessageContextMiddleware
                    - App\Shared\Infrastructure\Bus\Messenger\Middleware\MessageLoggingMiddleware

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async
            # Brevo webhook events, parsed by the webhook controller, consumed by the worker
            Symfony\Component\RemoteEvent\Messenger\ConsumeRemoteEventMessage: async
            # Domain Events (sync within bounded context)
            App\Shared\Domain\Event\DomainEventInterface: sync
            # Integration Events (async cross-bounded contexts)
            App\Shared\Domain\Event\IntegrationEventInterface: async
            # Commands calling external services (batch senders override with a TransportNamesStamp)
            App\Shared\Application\Bus\ExternalApiCommandInterface: async_external
            # Clinic directory (S7c): the geocoding of a listing's changed address (Messenger's 3 retries)
            App\Context\ClinicListing\Application\Command\GeocodeClinicListing\GeocodeClinicListing: async_external
            # Steps of the local e-invoicing platform simulator (dev / test / demo), delayed
            App\System\ElectronicInvoicing\Infrastructure\Platform\Simulator\AdvanceSimulatedFlow: async
            # Faked delivery webhooks of the local notification simulator (dev / test), delayed
            App\System\Notification\Infrastructure\Delivery\Simulator\AdvanceSimulatedDelivery: async
            # Retention and re-matching jobs: one transaction per batch / per provider id
            App\System\Notification\Application\Command\PurgeMessageContentBatch\PurgeMessageContentBatch: async
            App\System\Notification\Application\Command\DeleteMessageFiles\DeleteMessageFiles: async
            App\System\Notification\Application\Command\ReplayDeliveryEvents\ReplayDeliveryEvents: async
            # « Mot de passe oublié »: same answer and same response time whether the account exists or not
            App\System\IdentityAccess\Application\Command\RequestPasswordReset\RequestPasswordReset: async
            # Client messages of an appointment: the debounced sync (DelayStamp, D2) and the reminder of each due appointment
            App\Context\Scheduling\Application\Command\SyncAppointmentNotification\SyncAppointmentNotification: async
            App\Context\Scheduling\Application\Command\RequestAppointmentReminder\RequestAppointmentReminder: async
            # Bell entries (D13): « Nouveau RDV » to the veterinarian and its withdrawal, « Stock critique » to the assistants
            App\Context\Scheduling\Application\Command\PostNewAppointmentNotice\PostNewAppointmentNotice: async
            App\Context\Scheduling\Application\Command\WithdrawNewAppointmentNotice\WithdrawNewAppointmentNotice: async
            # Online booking (S4e): « RDV en ligne à confirmer » to the practitioner and its withdrawal,
            # and the decline of each expired pending request queued by the 15-minute scan
            App\Context\Scheduling\Application\Command\PostPendingBookingNotice\PostPendingBookingNotice: async
            App\Context\Scheduling\Application\Command\WithdrawPendingBookingNotice\WithdrawPendingBookingNotice: async
            App\Context\Scheduling\Application\Command\DeclineExpiredPendingAppointment\DeclineExpiredPendingAppointment: async
            App\Context\Inventory\Application\Command\NotifyCriticalStock\NotifyCriticalStock: async
            # Invoice e-mails and unpaid reminders: « Envoyer » / « Relancer » only log and queue them; a worker renders the PDF (AC 25)
            App\Context\Billing\Application\Command\SendInvoiceEmail\SendInvoiceEmail: async
            # Client Portal: replaced document files deleted 10 minutes later (DelayStamp), and the reconciliation of the expected files
            App\Context\ClientPortal\Application\Command\DeleteStoredDocumentFile\DeleteStoredDocumentFile: async
            App\Context\ClientPortal\Application\Command\ReconcilePublishedDocuments\ReconcilePublishedDocuments: async
            # Client Portal questionnaires: the lock of those whose visit started, every 5 minutes
            App\Context\ClientPortal\Application\Command\LockFrozenQuestionnaires\LockFrozenQuestionnaires: async
            # Client Portal data exports: the archive deleted 48 hours after it is ready (DelayStamp), and the nightly sweep
            App\Context\ClientPortal\Application\Command\DeleteDataExportFile\DeleteDataExportFile: async
            App\Context\ClientPortal\Application\Command\SweepExpiredDataExports\SweepExpiredDataExports: async
            # Client Portal account deletion: the erasure queued by the confirmed request (one transaction, retry-safe)
            App\Context\ClientPortal\Application\Command\DeletePortalAccount\DeletePortalAccount: async
            App\Context\Billing\Application\Command\SendUnpaidReminder\SendUnpaidReminder: async
            # Consultation documents e-mail: « Envoyer par e-mail » only checks and queues it; a worker renders the PDFs
            App\Context\Consultation\Application\Command\EmailConsultationDocuments\EmailConsultationDocuments: async
