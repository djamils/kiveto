framework:
    rate_limiter:
        api_clinic_search:
            policy: 'fixed_window'
            limit: 15
            interval: '1 second'

        api_clinic_ip:
            policy: 'fixed_window'
            limit: 60
            interval: '1 minute'

        # « Mot de passe oublié »: beyond either limit the page answers the
        # same message and nothing is sent.
        forgot_password_ip:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'

        forgot_password_email:
            policy: 'sliding_window'
            limit: 3
            interval: '1 hour'

        # Password sign-in (ContextAuthenticator, through app.login_rate_limiter):
        # per sign-in context, account and IP, and per IP for a password tried
        # on many accounts. A successful sign-in gives the attempts back.
        login_account:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'

        login_ip:
            policy: 'sliding_window'
            limit: 50
            interval: '15 minutes'
