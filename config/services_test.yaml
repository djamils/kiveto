# Test-only services, loaded by MicroKernelTrait when APP_ENV=test.
services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Probe command and handler used to prove command-bus/outbox atomicity.
    App\Tests\Integration\System\Messenger\Probe\:
        resource: '../tests/Integration/System/Messenger/Probe/'

    # The shared lock factory is inlined in its consumers; expose it to tests.
    test.shared.lock.factory:
        alias: shared.lock.factory
        public: true

    # Fails any HTTP call a test did not mock (framework.http_client.mock_response_factory).
    App\Tests\Support\UnmockedHttpCallGuard: ~

    # Records what entry points dispatch (ProfessionalClientEntryPointsTest).
    App\Tests\Support\RecordingCommandBus:
        decorates: App\Shared\Application\Bus\CommandBusInterface
        arguments: ['@.inner']
        public: true

    # Nothing consumes the external_api logger before the first adapter; expose it.
    test.monolog.logger.external_api:
        alias: monolog.logger.external_api
        public: true

    # Records what entry points queue for the external worker.
    App\Tests\Support\RecordingExternalApiCommandBus:
        decorates: App\Shared\Application\Bus\ExternalApiCommandBusInterface
        arguments: ['@.inner']
        public: true

    test.messenger.bus.external_api:
        alias: messenger.bus.external_api
        public: true

    # Adapter selection and per-container budgets (AdapterSelectionTest).
    test.client.company_registry.candidates:
        alias: client.company_registry.candidates
        public: true

    test.client.vat_verifier.candidates:
        alias: client.vat_verifier.candidates
        public: true

    test.client.external_limiter.lock_factory:
        alias: client.external_limiter.lock_factory
        public: true

    test.client.limiter.registry_web:
        alias: client.limiter.registry_web
        public: true

    test.client.limiter.registry_worker:
        alias: client.limiter.registry_worker
        public: true

    test.client.limiter.vies_worker:
        alias: client.limiter.vies_worker
        public: true

    test.client.company_registry:
        alias: App\Context\Client\Application\Port\CompanyRegistryInterface
        public: true

    test.client.vat_verifier:
        alias: App\Context\Client\Application\Port\VatNumberVerifierInterface
        public: true

    # Every schedule provider by name (SchedulerWorkerTimeLimitTest).
    App\Tests\Support\ScheduleProviders:
        public: true
        arguments: [!tagged_locator { tag: 'scheduler.schedule_provider', index_by: 'name' }]

    # Notification services read by the integration tests.
    test.App\System\Notification\Domain\Message\OutboundMessageRepositoryInterface:
        alias: App\System\Notification\Domain\Message\OutboundMessageRepositoryInterface
        public: true

    test.App\System\Notification\Domain\Clinic\ClinicMessagingProfileRepositoryInterface:
        alias: App\System\Notification\Domain\Clinic\ClinicMessagingProfileRepositoryInterface
        public: true

    test.App\System\Notification\Domain\Quota\VeterinarianCountRepositoryInterface:
        alias: App\System\Notification\Domain\Quota\VeterinarianCountRepositoryInterface
        public: true

    # ElectronicInvoicing services read by the integration tests.
    test.App\System\ElectronicInvoicing\Domain\Connection\PlatformConnectionRepositoryInterface:
        alias: App\System\ElectronicInvoicing\Domain\Connection\PlatformConnectionRepositoryInterface
        public: true

    test.App\System\ElectronicInvoicing\Domain\Transmission\OutboundTransmissionRepositoryInterface:
        alias: App\System\ElectronicInvoicing\Domain\Transmission\OutboundTransmissionRepositoryInterface
        public: true

    test.App\System\ElectronicInvoicing\Application\Port\SubmissionScheduleInterface:
        alias: App\System\ElectronicInvoicing\Application\Port\SubmissionScheduleInterface
        public: true

    test.App\System\ElectronicInvoicing\Application\Port\UnprocessedFlowsInterface:
        alias: App\System\ElectronicInvoicing\Application\Port\UnprocessedFlowsInterface
        public: true

    test.App\System\ElectronicInvoicing\Application\Port\DocumentStoreInterface:
        alias: App\System\ElectronicInvoicing\Application\Port\DocumentStoreInterface
        public: true
