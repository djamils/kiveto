zend_extension=xdebug

xdebug.client_host=host.docker.internal
xdebug.start_with_request=trigger
; Off unless asked for: the XDEBUG_MODE environment variable, which compose.yaml
; sets (`off` by default), overrides this line. Step debugging:
; `XDEBUG_MODE=debug make start`; coverage: `make test-coverage`.
xdebug.mode=off
