; OPcache of the dev php-fpm, sized like the production image
; (docker/production/php/kiveto.ini). With PHP's defaults the dev runtime
; fills it: vendor, src and the debug cache are some 26,000 PHP files for
; 10,000 slots, the 8M of interned strings run out, and the scripts left
; out are compiled again on every request.
; Unlike production, timestamps are still checked so that an edit shows at
; once, and nothing is preloaded. The memory is above production's 192M:
; each rebuild of the debug cache leaves its old scripts in it until the
; next OPcache restart.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 40000
