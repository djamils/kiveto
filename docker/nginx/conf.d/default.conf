# Secrets carried by URLs never reach the access log: the `token` query
# parameter (Brevo webhooks) and the token path segment of the password-reset
# and invitation links are replaced with `***` (Symfony logs: the Monolog
# WebhookTokenMaskingProcessor does the same). The Referer is not logged, as
# it may hold one of those links.
map $request_uri $kiveto_token_masked_uri {
    "~^(?<kt_head>[^?]*\?(?:[^#]*&)?token=)[^&#]*(?<kt_tail>.*)$" "${kt_head}***${kt_tail}";
    default $request_uri;
}

map $kiveto_token_masked_uri $kiveto_masked_uri {
    "~^(?<kp_head>/(?:reinitialiser|invitation)/)[^/?#]+(?<kp_tail>.*)$" "${kp_head}***${kp_tail}";
    default $kiveto_token_masked_uri;
}

log_format masked '$remote_addr - $remote_user [$time_local] "$request_method $kiveto_masked_uri $server_protocol" '
                  '$status $body_bytes_sent "$http_user_agent" "$http_x_forwarded_for"';

server {

    listen 80 default_server;
    server_name localhost clinic.kiveto.local portal.kiveto.local backoffice.kiveto.local;

    root /var/www/html/public;

    access_log /var/log/nginx/access.log masked;

    location / {
        # try to serve file directly, fallback to index.php
        try_files $uri /index.php$is_args$args;
     }

    location ~ \.php$ {
        fastcgi_pass php-fpm:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        internal;
    }
}
