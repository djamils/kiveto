; PHP-FPM pool of the `php` image, read after the official docker.conf and
; zz-docker.conf (listen 9000, errors on stderr, environment kept).
[www]
; Nginx writes the access log, with the tokens of the URLs masked: PHP-FPM's
; own access log would print them in clear.
access.log = /dev/null

; PHP_FPM_MAX_CHILDREN: 10 in the image (production), lowered on the sandbox.
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 1000

; max_execution_time does not count the time blocked on I/O (an unreachable
; database): a request still running after 65 s frees its worker.
request_terminate_timeout = 65s
