; Production settings of the `php` image, on top of php.ini-production.

expose_php = Off
memory_limit = 256M
max_execution_time = 30
; The edge Nginx accepts 20 MB bodies (client_max_body_size).
upload_max_filesize = 20M
post_max_size = 21M
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Sessions on the `share` volume (var/share): they survive a deployment.
session.save_path = /var/www/html/var/share/sessions

; PHP2Shell (CVE-2026-109618, CVE-2026-109619, CVE-2026-115560): 8.5.12 fixes
; it; these close its confirmed paths in case of a regression or a variant, as
; php.net advises. Kiveto never reports upload progress, and Symfony's error
; handler logs the fatal errors it can catch.
session.upload_progress.enabled = 0
fatal_error_backtraces = 0

; The code never changes inside an image: no timestamp checks, and the
; container of the warmed cache is preloaded (PHP-FPM only, not the CLI).
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 40000
opcache.validate_timestamps = 0
opcache.preload = /var/www/html/config/preload.php
opcache.preload_user = www-data
