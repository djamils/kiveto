# Nginx of the `nginx` image: every Kiveto host on 8080, behind the edge Nginx
# of the machine (TLS, X-Forwarded-*). Symfony checks the host
# (framework.trusted_hosts) and trusts the edge (SYMFONY_TRUSTED_PROXIES).

# Secrets carried by URLs never reach the access log: the `token` query
# parameter (Brevo webhooks) and the token path segment of the password-reset
# and invitation links are replaced with `***`, as in the dev configuration
# (docker/nginx/conf.d/default.conf, keep both in sync) and in the Monolog
# WebhookTokenMaskingProcessor. The Referer is not logged.
map $request_uri $kiveto_token_masked_uri {
    "~^(?<kt_head>[^?]*\?(?:[^#]*&)?token=)[^&#]*(?<kt_tail>.*)$" "${kt_head}***${kt_tail}";
    default $request_uri;
}

map $kiveto_token_masked_uri $kiveto_masked_uri {
    "~^(?<kp_head>/(?:reinitialiser|invitation)/)[^/?#]+(?<kp_tail>.*)$" "${kp_head}***${kp_tail}";
    default $kiveto_token_masked_uri;
}

log_format masked '$remote_addr - $remote_user [$time_local] "$request_method $kiveto_masked_uri $server_protocol" '
                  '$status $body_bytes_sent "$http_user_agent" "$http_x_forwarded_for"';

server_tokens off;

server {
    listen 8080 default_server;
    server_name _;

    root /var/www/html/public;
    access_log /var/log/nginx/access.log masked;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's DNS, so that a recreated `php` container is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream php:9000;

    # AssetMapper files carry a content hash in their name.
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        internal;
    }

    # No other PHP file is ever executed.
    location ~ \.php$ {
        return 404;
    }
}
