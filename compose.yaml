services:
  db:
    image: mysql:8.4.7
    environment:
      - MYSQL_DATABASE=kiveto
      - MYSQL_USER=kiveto
      - MYSQL_PASSWORD=kiveto
      - MYSQL_ROOT_PASSWORD=k!v3t0
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - kiveto-network

  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    volumes:
      - ./public:/var/www/html/public:delegated
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm
    ports:
      - "81:80"
    networks:
      - kiveto-network

  php-fpm:
    build:
      context: .
      dockerfile: ./docker/php-fpm/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./:/var/www/html:cached
      - ./docker/php-fpm/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
    environment:
      - DATABASE_URL=mysql://root:k!v3t0@db/kiveto?serverVersion=8.4.7
      - GOTENBERG_URL=http://gotenberg:3000
    depends_on:
      - db
      - gotenberg
    networks:
      - kiveto-network

  # Consumes the async transport (integration events, mails). Same image and code
  # as php-fpm; only started by `make worker-start` (profile `workers`) so that
  # `make install` never runs it before vendors and the database exist.
  messenger-worker:
    build:
      context: .
      dockerfile: ./docker/php-fpm/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    profiles: ["workers"]
    command: php -d memory_limit=512M bin/console messenger:consume async --time-limit=3600 --memory-limit=256M -vv
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:cached
    environment:
      - DATABASE_URL=mysql://root:k!v3t0@db/kiveto?serverVersion=8.4.7
      - GOTENBERG_URL=http://gotenberg:3000
    depends_on:
      - db
    networks:
      - kiveto-network

  # Consumes the commands that call external services (company registry, VIES,
  # later e-invoicing), so that slow or failing third parties never delay mails
  # and integration events, and vice versa. Messenger drains the first receiver
  # before the second: interactive verifications pass ahead of the nightly batch.
  external-worker:
    build:
      context: .
      dockerfile: ./docker/php-fpm/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    profiles: ["workers"]
    command: php -d memory_limit=512M bin/console messenger:consume async_external async_external_batch --time-limit=3600 --memory-limit=256M -vv
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:cached
    environment:
      - DATABASE_URL=mysql://root:k!v3t0@db/kiveto?serverVersion=8.4.7
      - GOTENBERG_URL=http://gotenberg:3000
    depends_on:
      - db
    networks:
      - kiveto-network

  # Runs the `default` schedule (src/Shared/Infrastructure/Scheduler) and the
  # `client` one (src/Context/Client/Infrastructure/Scheduler: nightly company
  # re-verification). Ticks are locked in the database, so several scheduler
  # workers never double-run a task.
  # The time limit (59 min) is deliberately not a multiple of any task period:
  # an hourly restart would otherwise always land on the hourly tick. Docker's
  # restart policy brings the worker back; a run lost to a restart is caught up
  # by the (idempotent) task itself.
  scheduler-worker:
    build:
      context: .
      dockerfile: ./docker/php-fpm/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    profiles: ["workers"]
    command: php -d memory_limit=512M bin/console messenger:consume scheduler_default scheduler_client --time-limit=3540 -vv
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:cached
    environment:
      - DATABASE_URL=mysql://root:k!v3t0@db/kiveto?serverVersion=8.4.7
      - GOTENBERG_URL=http://gotenberg:3000
    depends_on:
      - db
    networks:
      - kiveto-network

  # Chromium behind an HTTP API: turns the document templates into PDF.
  gotenberg:
    image: gotenberg/gotenberg:8
    # Only php-fpm talks to it, over the compose network. 3001 is published so a
    # failing render can be reproduced with curl from the host.
    ports:
      - "3001:3000"
    networks:
      - kiveto-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    depends_on:
      - db
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=k!v3t0
    ports:
      - "8081:80"
    networks:
      - kiveto-network

volumes:
  mysql_data:
    driver: local

networks:
  kiveto-network:
    driver: bridge
