openapi: 3.2.0
info:
  title: 'Kiveto Portal API'
  description: ''
  version: 1.0.0
servers:
  -
    url: /
    description: ''
paths:
  '/api/portal/v1/clinics/{clinicId}/home':
    get:
      operationId: api_clinics_clinicIdhome_get
      tags:
        - Animaux
      responses:
        '200':
          description: "L'accueil."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Home'
        '401':
          description: '`unauthorized` ou `token_expired`.'
        '404':
          description: '`not_found` (pas de lien confirmé avec la clinique).'
      summary: "L'accueil du propriétaire dans cette clinique."
      description: "Animaux vivants seulement. Prochain rendez-vous (forme complète d'un rendez-vous), 3 soins aux échéances les plus proches, 2 derniers documents. Une section vide est un tableau vide (`nextAppointment: null`)."
      parameters:
        -
          name: clinicId
          in: path
          description: 'Home identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
  '/api/portal/v1/clinics/{clinicId}/pets':
    get:
      operationId: api_clinics_clinicIdpets_get_collection
      tags:
        - Animaux
      responses:
        '200':
          description: 'Les animaux.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PetSummary'
        '401':
          description: '`unauthorized` ou `token_expired`.'
        '404':
          description: '`not_found` (pas de lien confirmé avec la clinique).'
      summary: 'Les animaux du propriétaire dans cette clinique.'
      description: "Décédés et disparus compris (`lifeStatus`). Vivants d'abord, puis par nom."
      parameters:
        -
          name: clinicId
          in: path
          description: 'PetSummary identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
  '/api/portal/v1/clinics/{clinicId}/pets/{petId}':
    get:
      operationId: api_clinics_clinicIdpets_petId_get
      tags:
        - Animaux
      responses:
        '200':
          description: "L'animal."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '401':
          description: '`unauthorized` ou `token_expired`.'
        '404':
          description: "`not_found` (pas de lien confirmé, ou animal archivé, en copropriété secondaire, vendu, donné ou d'un autre client)."
      summary: "La fiche d'un animal."
      description: "`lastWeight` = pesée la plus récente entre la fiche animal et les consultations clôturées (à date égale, la fiche l'emporte). `referentVet` = vétérinaire du dernier compte rendu partagé avec l'appelant."
      parameters:
        -
          name: clinicId
          in: path
          description: 'Pet identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
        -
          name: petId
          in: path
          description: 'Pet identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
  '/api/portal/v1/clinics/{clinicId}/pets/{petId}/care-items':
    get:
      operationId: api_clinics_clinicIdpets_petIdcare-items_get_collection
      tags:
        - Animaux
      responses:
        '200':
          description: 'Les soins.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CareItem'
        '401':
          description: '`unauthorized` ou `token_expired`.'
        '404':
          description: '`not_found` (pas de lien confirmé, ou animal non visible).'
      summary: 'Les soins préventifs à suivre pour un animal.'
      description: "Dernier acte de chaque protocole ayant une prochaine échéance, par échéance croissante. « Aujourd'hui » = date locale de la clinique. Vide pour un animal décédé ou disparu."
      parameters:
        -
          name: clinicId
          in: path
          description: 'CareItem identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
        -
          name: petId
          in: path
          description: 'CareItem identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
  '/api/portal/v1/clinics/{clinicId}/pets/{petId}/timeline':
    get:
      operationId: api_clinics_clinicIdpets_petIdtimeline_get
      tags:
        - Animaux
      responses:
        '200':
          description: 'Une page de visites.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetTimeline'
        '400':
          description: '`cursor_invalid`.'
        '401':
          description: '`unauthorized` ou `token_expired`.'
        '404':
          description: '`not_found` (pas de lien confirmé, ou animal non visible).'
      summary: "Les visites d'un animal dont le compte rendu a été partagé avec l'appelant."
      description: 'Par date de clôture décroissante. `date` = début de la consultation, avec le décalage de la clinique ; `vet` = nom figé au partage.'
      parameters:
        -
          name: clinicId
          in: path
          description: 'PetTimeline identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
        -
          name: petId
          in: path
          description: 'PetTimeline identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
        -
          name: cursor
          in: query
          description: 'PetTimeline cursor'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
        -
          name: limit
          in: query
          description: 'Taille de page, ramenée entre 1 et 50 (20 par défaut).'
          required: false
          deprecated: false
          schema:
            type: integer
          style: form
          explode: true
  '/api/portal/v1/clinics/{clinicId}/pets/{petId}/vaccination-booklet':
    get:
      operationId: api_portal_vaccination_booklet
      tags:
        - Animaux
      responses:
        '302':
          description: "Redirection vers l'URL signée (`Cache-Control: private, no-store`)."
        '404':
          description: '`not_found`.'
        '401':
          description: '`unauthorized` ou `token_expired`.'
        '503':
          description: '`service_unavailable` (`Retry-After`) : le service PDF est indisponible.'
      summary: "Télécharger le carnet de vaccination d'un animal."
      description: "PDF généré à la volée et mis en cache tant que ses données ne changent pas (vaccinations, identité, puce, en-tête de la clinique). « Aucune vaccination enregistrée » quand il n'y en a pas. Servi aussi pour un animal décédé. Redirige vers une URL signée valable 5 minutes."
      parameters:
        -
          name: clinicId
          in: path
          description: ''
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
        -
          name: petId
          in: path
          description: ''
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
  /api/portal/v1/clinic-listings:
    get:
      operationId: api_clinic-listings_get
      tags:
        - Annuaire
      responses:
        '200':
          description: 'Une page de cliniques.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicListings'
        '400':
          description: "`cursor_invalid` (illisible, ou émis pour d'autres coordonnées)."
        '422':
          description: '`validation_failed` (`q`, `lat`, `lng`).'
        '429':
          description: '`rate_limited` (120 requêtes par minute et par adresse IP), avec `Retry-After`.'
        '404':
          description: 'Not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
      summary: "Rechercher une clinique de l'annuaire."
      description: "Publique. Seules les cliniques Kiveto actives qui ont choisi de figurer dans l'annuaire. `q` (2 caractères au moins) cherche dans le nom et la ville. Avec `lat` et `lng` (ensemble) : tri par distance (150 km au plus), les cliniques sans coordonnées sont absentes de ce résultat seulement ; sinon tri par nom. Le curseur est lié à l'ordre et aux coordonnées de la recherche. `onlineBooking` est calculé en direct. `nextAvailableAt` est toujours `null` en v1."
      parameters:
        -
          name: q
          in: query
          description: 'Nom ou ville, 2 caractères au moins.'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
        -
          name: lat
          in: query
          description: 'Latitude, de -90 à 90, avec `lng`.'
          required: false
          deprecated: false
          schema:
            type: number
          style: form
          explode: true
        -
          name: lng
          in: query
          description: 'Longitude, de -180 à 180, avec `lat`.'
          required: false
          deprecated: false
          schema:
            type: number
          style: form
          explode: true
        -
          name: cursor
          in: query
          description: 'ClinicListings cursor'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
        -
          name: limit
          in: query
          description: 'Taille de page : 20 par défaut, ramenée à 50 au plus.'
          required: false
          deprecated: false
          schema:
            type: integer
          style: form
          explode: true
      security: []
  '/api/portal/v1/clinic-listings/{listingId}':
    get:
      operationId: api_clinic-listings_listingId_get
      tags:
        - Annuaire
      responses:
        '200':
          description: 'La clinique.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicListingDetail'
        '404':
          description: '`not_found` (inconnue, non listée ou inactive).'
        '429':
          description: '`rate_limited`, avec `Retry-After`.'
      summary: "La fiche d'une clinique de l'annuaire."
      description: "Publique (servira les pages web indexables). `openingHours` : les plages de la semaine type, par jour ISO (1 = lundi) puis heure d'ouverture, en heure locale de la clinique (`timezone`) ; les fermetures exceptionnelles n'y figurent pas."
      parameters:
        -
          name: listingId
          in: path
          description: 'ClinicListingDetail identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
      security: []
  '/api/portal/v1/clinic-listings/{listingId}/booking/appointments':
    post:
      operationId: api_clinic-listings_listingIdbookingappointments_post
      tags:
        - Annuaire
      responses:
        '201':
          description: 'La demande, `status: pending`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingBooking.BookingRequestView'
          links: {  }
        '400':
          description: '`idempotency_key_missing`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
        '401':
          description: '`unauthorized` ou `token_expired`.'
        '404':
          description: '`not_found` (fiche inconnue, non publiée ou inactive ; motif ou praticien inconnu).'
        '409':
          description: '`slot_taken` : recharger les créneaux.'
        '422':
          description: '`already_linked`, `booking_request_limit`, `booking_not_open`, `idempotency_key_reused` ou `validation_failed`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
          links: {  }
        '429':
          description: '`rate_limited` (en-tête `Retry-After`).'
      summary: "Demande un premier rendez-vous à une clinique de l'annuaire, en nouveau client."
      description: "Authentifié (seule route non-GET sous `/clinic-listings`). Le créneau est réservé en attente de confirmation par la clinique (toujours manuelle pour un nouveau client) ; aucun lien avec la clinique n'est créé avant qu'elle confirme. Au plus 1 demande en attente par clinique et 3 en tout ; 10 demandes par 24 h. La demande se suit avec `GET /me/booking-requests`."
      parameters:
        -
          name: Idempotency-Key
          in: header
          description: 'Clé aléatoire (UUID) propre à cette demande, réutilisée pour ses nouvelles tentatives.'
          required: true
          deprecated: false
          schema:
            type: string
            maxLength: 128
          style: simple
          explode: false
        -
          name: listingId
          in: path
          description: 'ListingBooking identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
      requestBody:
        description: 'The new ListingBooking resource'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingBooking'
        required: true
  '/api/portal/v1/clinic-listings/{listingId}/booking/availability':
    get:
      operationId: api_clinic-listings_listingIdbookingavailability_get
      tags:
        - Annuaire
      responses:
        '200':
          description: 'Les jours et leurs créneaux.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingAvailability'
        '404':
          description: '`not_found` (clinique inconnue, non listée ou inactive ; motif inconnu ou non ouvert aux nouveaux clients ; praticien non réservable pour ce motif).'
        '422':
          description: '`booking_not_open` ou `validation_failed` (intervalle).'
        '429':
          description: '`rate_limited`, avec `Retry-After`.'
      summary: 'Les créneaux réservables en ligne par un nouveau client.'
      description: 'Publique. Même forme et mêmes règles que `/clinics/{clinicId}/booking/availability`, mais un nouveau client est toujours validé par la clinique : seuls les créneaux au-delà du délai de confirmation sont proposés.'
      parameters:
        -
          name: listingId
          in: path
          description: 'ListingAvailability identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
        -
          name: motifId
          in: query
          description: 'ListingAvailability motifId'
          required: true
          deprecated: false
          schema:
            type: string
            format: uuid
          style: form
          explode: true
        -
          name: practitionerId
          in: query
          description: 'ListingAvailability practitionerId'
          required: true
          deprecated: false
          schema:
            type: string
            format: uuid
          style: form
          explode: true
        -
          name: from
          in: query
          description: 'ListingAvailability from'
          required: true
          deprecated: false
          schema:
            type: string
            format: date
          style: form
          explode: true
        -
          name: to
          in: query
          description: 'ListingAvailability to'
          required: true
          deprecated: false
          schema:
            type: string
            format: date
          style: form
          explode: true
      security: []
  '/api/portal/v1/clinic-listings/{listingId}/booking/motifs':
    get:
      operationId: api_clinic-listings_listingIdbookingmotifs_get_collection
      tags:
        - Annuaire
      responses:
        '200':
          description: 'Les motifs.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingMotifs.BookingMotifView'
        '404':
          description: '`not_found` (clinique inconnue, non listée ou inactive).'
        '422':
          description: '`booking_not_open` (la clinique ne prend pas de nouveaux clients en ligne).'
        '429':
          description: '`rate_limited`, avec `Retry-After`.'
      summary: 'Les motifs réservables en ligne par un nouveau client.'
      description: "Publique. Même forme que `/clinics/{clinicId}/booking/motifs`, dans l'ordre de la clinique : seuls les motifs ouverts en ligne aux nouveaux clients. Sans animal, `suggested` est toujours `false`."
      parameters:
        -
          name: listingId
          in: path
          description: 'ListingMotifs identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
      security: []
  '/api/portal/v1/clinic-listings/{listingId}/booking/practitioners':
    get:
      operationId: api_clinic-listings_listingIdbookingpractitioners_get_collection
      tags:
        - Annuaire
      responses:
        '200':
          description: 'Les praticiens.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingPractitioners.PractitionerView'
        '404':
          description: '`not_found` (clinique inconnue, non listée ou inactive ; motif inconnu, archivé, non ouvert en ligne ou aux nouveaux clients).'
        '422':
          description: '`booking_not_open` ou `validation_failed`.'
        '429':
          description: '`rate_limited`, avec `Retry-After`.'
      summary: 'Les praticiens réservables en ligne par un nouveau client pour un motif.'
      description: 'Publique. Même forme que `/clinics/{clinicId}/booking/practitioners`.'
      parameters:
        -
          name: listingId
          in: path
          description: 'ListingPractitioners identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
        -
          name: motifId
          in: query
          description: 'ListingPractitioners motifId'
          required: true
          deprecated: false
          schema:
            type: string
            format: uuid
          style: form
          explode: true
      security: []
  /api/portal/v1/auth/logout:
    post:
      operationId: api_authlogout_post
      tags:
        - Authentification
      responses:
        '204':
          description: Déconnecté.
          links: {  }
        '401':
          description: '`unauthorized` ou `token_expired`.'
        '400':
          description: 'Invalid input'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
        '422':
          description: 'An error occurred'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
          links: {  }
      summary: 'Révoque la famille du refresh token (déconnexion).'
      description: "Sans effet si le jeton n'appartient pas à l'appelant. L'access token reste valable jusqu'à son expiration (15 min)."
      parameters: []
      requestBody:
        description: 'The new SessionLogout resource'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLogout'
        required: true
  /api/portal/v1/auth/otp/request:
    post:
      operationId: api_authotprequest_post
      tags:
        - Authentification
      responses:
        '202':
          description: 'Code envoyé (ou non, sans que la réponse le dise).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequest.OtpChallengeView'
          links: {  }
        '422':
          description: '`phone_not_supported` ou `validation_failed`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
          links: {  }
        '429':
          description: '`otp_rate_limited`, avec `Retry-After`.'
        '400':
          description: 'Invalid input'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
      summary: 'Envoie un code de connexion par SMS.'
      description: "Même réponse que le numéro ait un compte ou non. Quotas : 3/h et 10/24 h par numéro, 30/h par IP. Pour un numéro inconnu, le SMS part dans la limite d'un budget par réseau (/24 en IPv4, /64 en IPv6), par appareil (`X-Device-Id`, simple indice) et global (500/h) ; au-delà, même réponse 202 sans SMS."
      parameters:
        -
          name: X-Device-Id
          in: header
          description: "Identifiant stable de l'installation de l'app (facultatif) : un indice de plus contre l'envoi massif de SMS, jamais la seule limite."
          required: false
          deprecated: false
          schema:
            type: string
            maxLength: 128
          style: simple
          explode: false
      requestBody:
        description: 'The new OtpRequest resource'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
        required: true
  /api/portal/v1/auth/otp/verify:
    post:
      operationId: api_authotpverify_post
      tags:
        - Authentification
      responses:
        '200':
          description: "`status` = `authenticated` (paire de jetons, invitations en attente), `invitation_pending` (jeton d'onboarding, invitations) ou `registration_required` (`registrationToken`, 15 min, usage unique, à présenter à `POST /auth/register`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerification.OtpVerificationView'
          links: {  }
        '403':
          description: '`account_disabled`.'
        '422':
          description: '`otp_invalid`, `otp_expired`, `otp_attempts_exceeded` ou `validation_failed`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
          links: {  }
        '400':
          description: 'Invalid input'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
      summary: 'Vérifie un code de connexion.'
      description: 'Vérifie un code de connexion.'
      parameters: []
      requestBody:
        description: 'The new OtpVerification resource'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerification'
        required: true
  '/api/portal/v1/auth/otp/{challengeId}/resend':
    post:
      operationId: api_authotp_challengeIdresend_post
      tags:
        - Authentification
      responses:
        '202':
          description: 'Nouveau code envoyé.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpResend.OtpChallengeView'
          links: {  }
        '404':
          description: '`otp_challenge_not_found`.'
        '422':
          description: '`validation_failed` (canal autre que `sms` ou `email`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
          links: {  }
        '429':
          description: '`otp_rate_limited` (avant `resendAvailableAt`, ou quotas), avec `Retry-After`.'
        '400':
          description: 'Invalid input'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
      summary: 'Renvoie un nouveau code pour le même challenge.'
      description: "Le code précédent ne fonctionne plus. `email` n'est honoré que pour un code de **connexion** dont le numéro a un compte actif avec e-mail **vérifié** (second facteur) ; sinon même 202, rien ne change et le code SMS reste valable. Les codes d'action (changement d'e-mail, suppression) ne sont jamais renvoyés par e-mail ; un code de vérification d'e-mail n'est jamais renvoyé."
      parameters:
        -
          name: challengeId
          in: path
          description: 'OtpResend identifier'
          required: true
          deprecated: false
          schema:
            type: string
