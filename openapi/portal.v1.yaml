          type: string
        termsVersion:
          description: 'The `version` of /legal/terms/current.'
          type: string
    InvitationAcceptance.AcceptedInvitationView:
      type: object
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
        account:
          $ref: '#/components/schemas/AccountView'
    InvitationClinicView:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        city:
          type:
            - string
            - 'null'
    InvitationGrantAcceptance:
      type: object
      required:
        - onboardingToken
        - termsVersion
      properties:
        onboardingToken:
          type: string
        termsVersion:
          description: 'The `version` of /legal/terms/current.'
          type: string
    InvitationGrantAcceptance.AcceptedInvitationView:
      type: object
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
