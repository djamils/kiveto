          type:
            - string
            - 'null'
        maskedPhone:
          type: string
        address:
          anyOf:
            -
              $ref: '#/components/schemas/AddressView'
            -
              type: 'null'
    AddressView:
      type: object
      properties:
        line1:
          type: string
        line2:
          type:
            - string
            - 'null'
        postalCode:
          type:
            - string
            - 'null'
        city:
          type: string
        country:
          type: string
    Appointment.AppointmentView:
      type: object
      description: 'An appointment of the owner (AppointmentView).'
      properties:
        id:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        pet:
          anyOf:
            -
              $ref: '#/components/schemas/PetReferenceView'
            -
              type: 'null'
        motif:
          $ref: '#/components/schemas/MotifReferenceView'
        practitioner:
          $ref: '#/components/schemas/PractitionerView'
        status:
          type: string
          enum:
            - confirmed
            - pending_clinic_confirmation
            - cancelled_by_client
            - cancelled_by_clinic
            - declined
            - completed
            - no_show
        source:
          type: string
          enum:
            - clinic
            - portal
        cancellableUntil:
          type:
            - string
            - 'null'
          format: date-time
        questionnaireStatus:
          type: string
          enum:
            - not_started
            - submitted
        relatedCareItem:
          anyOf:
            -
              $ref: '#/components/schemas/RelatedCareItemView'
            -
              type: 'null'
    AppointmentBooking:
      type: object
      properties:
        petId:
          type: string
          format: uuid
        motifId:
          type: string
          format: uuid
        practitionerId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
    AppointmentBooking.AppointmentView:
      type: object
      properties:
        id:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        pet:
          anyOf:
            -
              $ref: '#/components/schemas/PetReferenceView'
            -
              type: 'null'
        motif:
          $ref: '#/components/schemas/MotifReferenceView'
        practitioner:
          $ref: '#/components/schemas/PractitionerView'
        status:
          type: string
