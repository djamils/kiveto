openapi: 3.2.0
info:
  title: 'Kiveto Portal API'
  description: ''
  version: 1.0.0
servers:
  -
    url: /
    description: ''
paths:
  '/api/portal/v1/clinics/{clinicId}/home':
    get:
      operationId: api_clinics_clinicIdhome_get
      tags:
        - Animaux
      responses:
        '200':
          description: "L'accueil."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Home'
        '401':
          description: '`unauthorized` ou `token_expired`.'
        '404':
          description: '`not_found` (pas de lien confirmé avec la clinique).'
      summary: "L'accueil du propriétaire dans cette clinique."
      description: 'Animaux vivants seulement. Prochain rendez-vous, 3 soins aux échéances les plus proches, 2 derniers documents. Une section vide est un tableau vide (`nextAppointment: null`).'
      parameters:
        -
          name: clinicId
          in: path
          description: 'Home identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
  '/api/portal/v1/clinics/{clinicId}/pets':
    get:
      operationId: api_clinics_clinicIdpets_get_collection
      tags:
        - Animaux
      responses:
        '200':
          description: 'Les animaux.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PetSummary'
        '401':
          description: '`unauthorized` ou `token_expired`.'
        '404':
          description: '`not_found` (pas de lien confirmé avec la clinique).'
      summary: 'Les animaux du propriétaire dans cette clinique.'
      description: "Décédés et disparus compris (`lifeStatus`). Vivants d'abord, puis par nom."
      parameters:
        -
          name: clinicId
          in: path
          description: 'PetSummary identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
  '/api/portal/v1/clinics/{clinicId}/pets/{petId}':
    get:
      operationId: api_clinics_clinicIdpets_petId_get
      tags:
        - Animaux
      responses:
        '200':
          description: "L'animal."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '401':
          description: '`unauthorized` ou `token_expired`.'
        '404':
          description: "`not_found` (pas de lien confirmé, ou animal archivé, en copropriété secondaire, vendu, donné ou d'un autre client)."
      summary: "La fiche d'un animal."
      description: "`lastWeight` = pesée la plus récente entre la fiche animal et les consultations clôturées (à date égale, la fiche l'emporte). `referentVet` = vétérinaire du dernier compte rendu partagé avec l'appelant."
      parameters:
        -
          name: clinicId
          in: path
          description: 'Pet identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
        -
          name: petId
          in: path
          description: 'Pet identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
  '/api/portal/v1/clinics/{clinicId}/pets/{petId}/care-items':
    get:
      operationId: api_clinics_clinicIdpets_petIdcare-items_get_collection
      tags:
        - Animaux
      responses:
        '200':
          description: 'Les soins.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CareItem'
        '401':
          description: '`unauthorized` ou `token_expired`.'
        '404':
          description: '`not_found` (pas de lien confirmé, ou animal non visible).'
      summary: 'Les soins préventifs à suivre pour un animal.'
      description: "Dernier acte de chaque protocole ayant une prochaine échéance, par échéance croissante. « Aujourd'hui » = date locale de la clinique. Vide pour un animal décédé ou disparu."
      parameters:
        -
          name: clinicId
          in: path
          description: 'CareItem identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
        -
          name: petId
          in: path
          description: 'CareItem identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
  '/api/portal/v1/clinics/{clinicId}/pets/{petId}/timeline':
    get:
      operationId: api_clinics_clinicIdpets_petIdtimeline_get
      tags:
        - Animaux
      responses:
        '200':
          description: 'Une page de visites.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetTimeline'
        '400':
          description: '`cursor_invalid`.'
        '401':
          description: '`unauthorized` ou `token_expired`.'
        '404':
          description: '`not_found` (pas de lien confirmé, ou animal non visible).'
      summary: "Les visites d'un animal dont le compte rendu a été partagé avec l'appelant."
      description: 'Par date de clôture décroissante. `date` = début de la consultation, avec le décalage de la clinique ; `vet` = nom figé au partage.'
      parameters:
        -
          name: clinicId
          in: path
          description: 'PetTimeline identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
        -
          name: petId
          in: path
          description: 'PetTimeline identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
        -
          name: cursor
          in: query
          description: 'PetTimeline cursor'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
        -
          name: limit
          in: query
          description: 'Taille de page, ramenée entre 1 et 50 (20 par défaut).'
          required: false
          deprecated: false
          schema:
            type: integer
          style: form
          explode: true
  '/api/portal/v1/clinics/{clinicId}/pets/{petId}/vaccination-booklet':
    get:
      operationId: api_portal_vaccination_booklet
      tags:
        - Animaux
      responses:
        '302':
          description: "Redirection vers l'URL signée (`Cache-Control: private, no-store`)."
        '404':
          description: '`not_found`.'
        '401':
          description: '`unauthorized` ou `token_expired`.'
      summary: "Télécharger le carnet de vaccination d'un animal."
      description: "PDF généré à la volée et mis en cache tant que ses données ne changent pas (vaccinations, identité, puce, en-tête de la clinique). « Aucune vaccination enregistrée » quand il n'y en a pas. Servi aussi pour un animal décédé. Redirige vers une URL signée valable 5 minutes."
      parameters:
        -
          name: clinicId
          in: path
          description: ''
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
        -
          name: petId
          in: path
          description: ''
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
  /api/portal/v1/auth/logout:
    post:
      operationId: api_authlogout_post
      tags:
        - Authentification
      responses:
        '204':
          description: Déconnecté.
          links: {  }
        '401':
          description: '`unauthorized` ou `token_expired`.'
        '400':
          description: 'Invalid input'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
        '422':
          description: 'An error occurred'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
          links: {  }
      summary: 'Révoque la famille du refresh token (déconnexion).'
      description: "Sans effet si le jeton n'appartient pas à l'appelant. L'access token reste valable jusqu'à son expiration (15 min)."
      parameters: []
      requestBody:
        description: 'The new SessionLogout resource'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLogout'
        required: true
  /api/portal/v1/auth/otp/request:
    post:
      operationId: api_authotprequest_post
      tags:
        - Authentification
      responses:
        '202':
          description: 'Code envoyé (ou non, sans que la réponse le dise).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequest.OtpChallengeView'
          links: {  }
        '422':
          description: '`phone_not_supported` ou `validation_failed`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
          links: {  }
        '429':
          description: '`otp_rate_limited`, avec `Retry-After`.'
        '400':
          description: 'Invalid input'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
      summary: 'Envoie un code de connexion par SMS.'
      description: 'Même réponse que le numéro ait un compte ou non. Quotas : 3/h et 10/24 h par numéro, 30/h par IP.'
      parameters: []
      requestBody:
        description: 'The new OtpRequest resource'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
        required: true
  /api/portal/v1/auth/otp/verify:
    post:
      operationId: api_authotpverify_post
      tags:
        - Authentification
      responses:
        '200':
          description: "`status` = `authenticated` (paire de jetons, invitations en attente), `invitation_pending` (jeton d'onboarding, invitations) ou `registration_required`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerification.OtpVerificationView'
          links: {  }
        '403':
          description: '`account_disabled`.'
        '422':
          description: '`otp_invalid`, `otp_expired`, `otp_attempts_exceeded` ou `validation_failed`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
          links: {  }
        '400':
          description: 'Invalid input'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
      summary: 'Vérifie un code de connexion.'
      description: 'Vérifie un code de connexion.'
      parameters: []
      requestBody:
        description: 'The new OtpVerification resource'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerification'
        required: true
  '/api/portal/v1/auth/otp/{challengeId}/resend':
    post:
      operationId: api_authotp_challengeIdresend_post
      tags:
        - Authentification
      responses:
        '202':
          description: 'Nouveau code envoyé.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpResend.OtpChallengeView'
          links: {  }
        '404':
          description: '`otp_challenge_not_found`.'
        '422':
          description: '`validation_failed` (canal inconnu).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
          links: {  }
        '429':
          description: '`otp_rate_limited` (avant `resendAvailableAt`, ou quotas), avec `Retry-After`.'
        '400':
          description: 'Invalid input'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
      summary: 'Renvoie un nouveau code pour le même challenge.'
      description: "Le code précédent ne fonctionne plus. Seul le canal `sms` existe pour l'instant."
      parameters:
        -
          name: challengeId
          in: path
          description: 'OtpResend identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
      requestBody:
        description: 'The new OtpResend resource'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpResend'
        required: true
  /api/portal/v1/auth/refresh:
    post:
      operationId: api_authrefresh_post
      tags:
        - Authentification
      responses:
        '200':
          description: 'Nouvelle paire.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRefresh.SessionTokensView'
          links: {  }
        '401':
          description: '`refresh_revoked` : se reconnecter par code.'
        '400':
          description: 'Invalid input'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
        '422':
          description: 'An error occurred'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
          links: {  }
      summary: 'Échange un refresh token contre une nouvelle paire.'
      description: 'Rotation à chaque usage. Le client doit sérialiser ses refresh : rejouer un jeton plus de 30 s après son usage, ou deux fois, révoque toute la famille.'
      parameters: []
      requestBody:
        description: 'The new SessionRefresh resource'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRefresh'
        required: true
  /api/portal/v1/legal/terms/current:
    get:
      operationId: api_legaltermscurrent_get
      tags:
        - CGU
      responses:
        '200':
          description: 'CurrentTerms resource'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentTerms'
        '404':
          description: 'Not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
      summary: "Version courante des conditions d'utilisation du Portal."
      description: "Publique. `version` est la valeur attendue par les routes d'acceptation (`termsVersion`)."
      parameters: []
  /api/portal/v1/me:
    get:
      operationId: api_me_get
      tags:
        - Compte
      responses:
        '200':
          description: 'Compte et cliniques.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: '`unauthorized` ou `token_expired`.'
        '404':
          description: 'Not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
      summary: 'Le compte et ses cliniques rattachées.'
      description: 'Ne liste pas les invitations en attente : elles apparaissent à la prochaine connexion par code.'
      parameters: []
  '/api/portal/v1/clinics/{clinicId}/documents':
    get:
      operationId: api_clinics_clinicIddocuments_get
      tags:
        - Documents
      responses:
        '200':
          description: 'Une page de documents.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
        '400':
          description: '`cursor_invalid`.'
        '401':
          description: '`unauthorized` ou `token_expired`.'
        '404':
          description: '`not_found` (pas de lien confirmé avec la clinique).'
        '422':
          description: '`validation_failed`.'
      summary: 'Les documents publiés pour le propriétaire dans cette clinique.'
      description: 'Du plus récent au plus ancien. Statut de paiement et état des ordonnances lus en direct.'
      parameters:
        -
          name: clinicId
          in: path
          description: 'DocumentList identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
        -
          name: type
          in: query
          description: 'DocumentList type'
          required: false
          deprecated: false
          schema:
            type: string
            enum:
              - report
              - prescription
              - invoice
              - lab_result
              - certificate
          style: form
          explode: true
        -
          name: petId
          in: query
          description: 'DocumentList petId'
          required: false
          deprecated: false
          schema:
            type: string
            format: uuid
          style: form
          explode: true
        -
          name: cursor
          in: query
          description: 'DocumentList cursor'
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: true
        -
          name: limit
          in: query
          description: 'Taille de page : 20 par défaut, ramenée à 50 au plus.'
          required: false
          deprecated: false
          schema:
            type: integer
          style: form
          explode: true
  '/api/portal/v1/clinics/{clinicId}/documents/{documentId}/file':
    get:
      operationId: api_portal_document_file
      tags:
        - Documents
      responses:
        '302':
          description: "Redirection vers l'URL signée (`Cache-Control: private, no-store`)."
        '404':
          description: '`not_found`.'
        '401':
          description: '`unauthorized` ou `token_expired`.'
      summary: 'Télécharger un document.'
      description: "Marque le document comme lu pour l'appelant, puis redirige vers une URL signée valable 5 minutes."
      parameters:
        -
          name: clinicId
          in: path
          description: ''
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
        -
          name: documentId
          in: path
          description: ''
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
  '/api/portal/v1/clinics/{clinicId}/prescriptions/{prescriptionId}':
    get:
      operationId: api_clinics_clinicIdprescriptions_prescriptionId_get
      tags:
        - Documents
      responses:
        '200':
          description: "L'ordonnance."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
        '401':
          description: '`unauthorized` ou `token_expired`.'
        '404':
          description: "`not_found` (non publiée, retirée ou d'un autre client)."
      summary: 'Une ordonnance publiée et ses lignes.'
      description: 'Une ordonnance publiée et ses lignes.'
      parameters:
        -
          name: clinicId
          in: path
          description: 'Prescription identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
        -
          name: prescriptionId
          in: path
          description: 'Prescription identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
  '/api/portal/v1/files/booklets/{clinicId}/{animalId}/{hash}':
    get:
      operationId: api_portal_booklet_download
      tags:
        - Fichiers
      responses:
        '200':
          description: 'Le PDF (`Cache-Control: private, no-store`).'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: '`not_found`.'
      summary: "Le PDF d'un carnet de vaccination (URL signée)."
      description: "Publique : la signature tient lieu d'authentification, 5 minutes."
      parameters:
        -
          name: clinicId
          in: path
          description: ''
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
        -
          name: animalId
          in: path
          description: ''
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
        -
          name: hash
          in: path
          description: ''
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
      security: []
  '/api/portal/v1/files/documents/{clinicId}/{documentId}/{version}':
    get:
      operationId: api_portal_document_download
      tags:
        - Fichiers
      responses:
        '200':
          description: 'Le PDF (`Cache-Control: private, no-store`).'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: '`not_found`.'
      summary: "Le PDF d'un document (URL signée)."
      description: "Publique : la signature tient lieu d'authentification, 5 minutes. Sert la version signée même si une plus récente a été publiée depuis."
      parameters:
        -
          name: clinicId
          in: path
          description: ''
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
        -
          name: documentId
          in: path
          description: ''
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
        -
          name: version
          in: path
          description: ''
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
      security: []
  /api/portal/v1/invitations/accept:
    post:
      operationId: api_invitationsaccept_post
      tags:
        - Invitation
      responses:
        '200':
          description: 'Paire de jetons et compte.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptance.AcceptedInvitationView'
          links: {  }
        '403':
          description: '`account_disabled`.'
        '404':
          description: '`invitation_invalid`.'
        '410':
          description: '`invitation_expired` ou `invitation_already_used`.'
        '422':
          description: '`otp_invalid`, `otp_expired`, `otp_attempts_exceeded`, `terms_outdated` ou `validation_failed`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
          links: {  }
        '400':
          description: 'Invalid input'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
      summary: 'Accepte une invitation par le lien : jeton + code reçu par SMS.'
      description: 'Rejouable : la même requête (même code, avant son expiration) après une réponse perdue renvoie une paire neuve.'
      parameters: []
      requestBody:
        description: 'The new InvitationAcceptance resource'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptance'
        required: true
  /api/portal/v1/invitations/lookup:
    post:
      operationId: api_invitationslookup_post
      tags:
        - Invitation
      responses:
        '200':
          description: 'Clinique, e-mail, téléphone masqué, animaux.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationLookup.InvitationLookupView'
          links: {  }
        '404':
          description: '`invitation_invalid` (inconnue, ou jeton remplacé par un renvoi).'
        '410':
          description: '`invitation_expired` ou `invitation_already_used`.'
        '400':
          description: 'Invalid input'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
        '422':
          description: 'An error occurred'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
          links: {  }
      summary: 'Affiche une invitation à partir du jeton de son lien (`#t=`).'
      description: "Le jeton voyage dans le corps, jamais dans l'URL."
      parameters: []
      requestBody:
        description: 'The new InvitationLookup resource'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationLookup'
        required: true
  /api/portal/v1/invitations/otp:
    post:
      operationId: api_invitationsotp_post
      tags:
        - Invitation
      responses:
        '202':
          description: 'Code envoyé.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationOtpRequest.OtpChallengeView'
          links: {  }
        '404':
          description: '`invitation_invalid`.'
        '410':
          description: '`invitation_expired` ou `invitation_already_used`.'
        '429':
          description: '`otp_rate_limited`, avec `Retry-After`.'
        '400':
          description: 'Invalid input'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
        '422':
          description: 'An error occurred'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
          links: {  }
      summary: "Envoie un code au mobile de l'invitation."
      description: 'Quotas : 3/h par invitation, 3/h et 10/24 h par numéro, 30/h par IP.'
      parameters: []
      requestBody:
        description: 'The new InvitationOtpRequest resource'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationOtpRequest'
        required: true
  '/api/portal/v1/invitations/{invitationId}/accept':
    post:
      operationId: api_invitations_invitationIdaccept_post
      tags:
        - Invitation
      responses:
        '200':
          description: 'Paire de jetons et compte.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationGrantAcceptance.AcceptedInvitationView'
          links: {  }
        '401':
          description: '`onboarding_invalid`.'
        '403':
          description: '`account_disabled`.'
        '404':
          description: '`invitation_invalid`.'
        '422':
          description: '`terms_outdated` ou `validation_failed`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintViolation'
          links: {  }
        '400':
          description: 'Invalid input'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
      summary: "Accepte une invitation après connexion par numéro, avec le jeton d'onboarding."
      description: "Le jeton d'onboarding vient de `/auth/otp/verify` et n'est accepté que par cette route. Après l'acceptation de la dernière invitation du numéro, il est révoqué : en cas de `401 onboarding_invalid` après une réponse perdue, refaire la connexion par numéro."
      parameters:
        -
          name: invitationId
          in: path
          description: 'InvitationGrantAcceptance identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
      requestBody:
        description: 'The new InvitationGrantAcceptance resource'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationGrantAcceptance'
        required: true
components:
  schemas:
    AccountView:
      type: object
      properties:
        id:
          type: string
        firstName:
          type:
            - string
            - 'null'
        lastName:
          type:
            - string
            - 'null'
        email:
          description: 'Unverified, possibly null.'
          type:
            - string
            - 'null'
        maskedPhone:
          type: string
        address:
          anyOf:
            -
              $ref: '#/components/schemas/AddressView'
            -
              type: 'null'
    AddressView:
      type: object
      properties:
        line1:
          type: string
        line2:
          type:
            - string
            - 'null'
        postalCode:
          type:
            - string
            - 'null'
        city:
          type: string
        country:
          type: string
    CareItem:
      type: object
      description: |-
        The latest act of a preventive protocol and where it stands against its
        due date. The care-items route answers a plain JSON array of it.
      properties:
        kind:
          type: string
        label:
          type: string
        lastDoneOn:
          type: string
          format: date
        dueOn:
          type: string
          format: date
        status:
          type: string
          enum:
            - overdue
            - due_soon
            - up_to_date
    ClinicLinkView:
      type: object
      properties:
        clinicId:
          type: string
        name:
          type: string
        city:
          type:
            - string
            - 'null'
        timezone:
          type: string
        linkStatus:
          type: string
          enum:
            - confirmed
        linkedAt:
          type: string
          format: date-time
        petNames:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        unreadDocuments:
          type: integer
    ConstraintViolation:
      type: object
      description: 'Unprocessable entity'
      properties:
        status:
          default: 422
          type: integer
        violations:
          type: array
          items:
            type: object
            properties:
              propertyPath:
                type: string
                description: 'The property path of the violation'
              message:
                type: string
                description: 'The message associated with the violation'
              code:
                type: string
                description: 'The code of the violation'
              hint:
                type: string
                description: 'An extra hint to understand the violation'
              payload:
                type: object
                additionalProperties: true
                description: 'The serialized payload of the violation'
            required:
              - propertyPath
              - message
        detail:
          readOnly: true
          type: string
        type:
          readOnly: true
          type: string
        title:
          readOnly: true
          type:
            - string
            - 'null'
        instance:
          readOnly: true
          type:
            - string
            - 'null'
    CurrentTerms:
      type: object
      properties:
        version:
          type: string
        url:
          type: string
    DocumentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentView'
        nextCursor:
          type:
            - string
            - 'null'
    DocumentView:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - report
            - prescription
            - invoice
            - lab_result
            - certificate
        title:
          type: string
        petIds:
          type: array
          items:
            type: string
        issuedAt:
          type: string
          format: date-time
        unread:
          type: boolean
        invoice:
          anyOf:
            -
              $ref: '#/components/schemas/InvoiceSummaryView'
            -
              type: 'null'
        prescription:
          anyOf:
            -
              $ref: '#/components/schemas/PrescriptionSummaryView'
            -
              type: 'null'
    Error:
      type: object
      description: 'A representation of common errors.'
      properties:
        title:
          readOnly: true
          description: 'A short, human-readable summary of the problem.'
          type:
            - string
            - 'null'
        detail:
          readOnly: true
          description: 'A human-readable explanation specific to this occurrence of the problem.'
          type:
            - string
            - 'null'
        status:
          type:
            - integer
            - 'null'
          examples:
            - 404
          default: 400
        instance:
          readOnly: true
          description: 'A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.'
          type:
            - string
            - 'null'
        type:
          readOnly: true
          description: 'A URI reference that identifies the problem type'
          type: string
    Home:
      type: object
      properties:
        nextAppointment:
          anyOf:
            -
              $ref: '#/components/schemas/NextAppointmentView'
            -
              type: 'null'
        pets:
          type: array
          items:
            $ref: '#/components/schemas/PetSummary'
        careItems:
          type: array
          items:
            $ref: '#/components/schemas/HomeCareItemView'
        latestDocuments:
          type: array
          items:
            $ref: '#/components/schemas/DocumentView'
    HomeCareItemView:
      type: object
      properties:
        pet:
          $ref: '#/components/schemas/PetReferenceView'
        kind:
          type: string
        label:
          type: string
        lastDoneOn:
          type: string
          format: date
        dueOn:
          type: string
          format: date
        status:
          type: string
          enum:
            - overdue
            - due_soon
            - up_to_date
    InvitationAcceptance:
      type: object
      required:
        - token
        - challengeId
        - code
        - termsVersion
